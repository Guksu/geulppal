name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 모델을 부르지 않는 검사만 돌린다
      - name: 구조 검사
        run: node scripts/eval/check.mjs
      - name: 회귀 테스트와 공개 기록 재집계
        run: node --test 'scripts/eval/test/*.test.mjs'
